name: CI

# The checks every commit is meant to pass, run where they cannot be
# skipped. .pre-commit-config.yaml is the whole gate; this workflow
# exists so that something other than whoever remembers to runs it.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # A venv because the runners enforce PEP 668 and refuse a bare
      # install. Under runner.temp, with --clear, because a fixed /tmp
      # path is shared with every other job on the host.
      - name: Install pre-commit
        run: |
          python3 -m venv --clear "${RUNNER_TEMP}/venv-lint"
          "${RUNNER_TEMP}/venv-lint/bin/pip" install --quiet --disable-pip-version-check \
              pre-commit

      # This runs every hook, skillsaw included, so this is also the
      # CI half of the llm-context-lint-ci audit.
      - name: Run pre-commit hooks
        run: |
          PATH="${RUNNER_TEMP}/venv-lint/bin:${PATH}"
          pre-commit run --all-files --show-diff-on-failure

      - name: Clean up
        if: always()
        run: rm -rf "${RUNNER_TEMP}/venv-lint"

  # The automatic review, gated on lint passing: a job that is skipped
  # because a dependency failed never starts the reusable workflow, so
  # the needs list is the CI-passed gate. The reusable workflow skips
  # itself on workflow_dispatch, which is how pr-retest.yml re-runs
  # this file. The permissions block has to be here, because a
  # cross-repository reusable workflow cannot grant itself more token
  # scope than its caller has. Deliberately no secrets: inherit --
  # nothing in the reviewer chain reads a secret.
  automated_reviewer:
    name: "Automated reviewer"
    needs: [lint]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
